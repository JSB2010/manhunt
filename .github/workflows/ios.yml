name: ios
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**']
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Unit tests (simulator)
        run: |
          xcodebuild test -project ios/ManhuntCrews.xcodeproj -scheme ManhuntCrews \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:ManhuntCrewsTests -derivedDataPath ios/build
      - name: Release build compiles (no signing)
        run: |
          xcodebuild build -project ios/ManhuntCrews.xcodeproj -scheme ManhuntCrews -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath ios/build
